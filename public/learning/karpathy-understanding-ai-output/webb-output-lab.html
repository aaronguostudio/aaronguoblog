const messages={"zh": {"eyebrow": "真实问题 · 同一组事实", "title": "为什么把韦伯送到地球外约 150 万公里？", "intro": "先看原因，再看关系，最后改变一个条件。这里用 NASA 公开资料，做一套专门帮助理解的输出。", "textTab": "01 文字", "diagramTab": "02 图解", "interactiveTab": "03 交互", "videoTab": "04 视频分镜", "textHeading": "用三句话，把原因讲清楚", "plain": "韦伯观察红外光。为了看清很微弱的信号，它的镜面和探测器需要保持很冷。它在 L2 附近的位置，让遮阳板能够挡在望远镜与太阳、地球、月亮之间，保护冷的一侧。", "textTakeaway": "文字帮你回答：为什么需要这样的安排？", "precision": "它绕太阳运行，并在 L2 附近绕行；并不静止停在那个点，也不依靠藏进地球阴影来冷却。", "diagramHeading": "把一句话，变成可以指给别人看的关系", "diagramTakeaway": "图解帮你回答：什么挡在什么之间？", "interactiveHeading": "先预测：远离地球，能代替遮阳板吗？", "interactiveTakeaway": "交互帮你检查：改变一个条件，关系怎样变化？", "sunControl": "显示太阳的示意线", "earthControl": "显示地球的示意线", "moonControl": "显示月亮的示意线", "shieldControl": "显示遮阳板", "shieldOn": "图中的示意线止于遮阳板。", "shieldOff": "隐藏遮阳板后，图中的示意线到达望远镜。距离不能代替遮挡。", "none": "所有示意线已隐藏。这只改变画面，天体并没有消失。", "lineCount": "当前显示的示意线：", "interactionNote": "控制开关改变的是这张示意图。它不改变真实天体，也不计算温度或热量。", "videoHeading": "把原因，排成一条能跟随的路线", "videoTakeaway": "视频帮你跟随：先注意什么，再理解什么？", "storyLabel": "网页动画分镜预览 · 尚非配音成片", "next": "下一步", "play": "播放分镜", "pause": "暂停", "reset": "回到开头", "sourcesHeading": "事实从哪里来", "sourcesNote": "NASA 的真实任务；四种解释形式与交互由我们制作。没有声称 NASA 使用了 agent，也没有比较学习效果的实验。", "back": "返回文章", "taskHeading": "把这个任务交给 agent", "task": "只使用下方 NASA 资料，解释“为什么韦伯要去 L2 附近”。先写三句通俗解释，再画位置关系图，做一个可切换遮阳板的页面，最后给出讲解分镜。四种形式保持事实一致；标出资料链接和每一种简化。", "diagramTitle": "把热源留在遮阳板的同一侧", "coldSide": "冷的一侧", "sun": "太阳", "earth": "地球", "moon": "月亮", "sourceLabel": "光与热的来源", "shieldLabel": "遮阳板", "scopeLabel": "望远镜", "location": "韦伯绕太阳运行，在距地球约 150 万公里的 L2 附近绕行。", "limit": "位置与遮挡示意 · 尺寸、距离、热量不按比例 · 并非温度模拟", "steps": [["01 / 为什么要冷", "先让观众理解需求：很微弱的红外信号，需要很冷的镜面与探测器。"], ["02 / 热从哪里来", "逐个引入太阳、地球和月亮，让三个来源保持在画面的同一侧。"], ["03 / 遮阳板做什么", "加入遮阳板。来源、遮挡与望远镜的位置关系，开始连成原因。"], ["04 / 位置为什么有用", "L2 附近的位置帮助保持这种安排。此图只示意遮挡；真实韦伯在 L2 附近绕行。接着邀请观众预测：如果没有遮阳板呢？"]]}, "en": {"eyebrow": "A REAL QUESTION · THE SAME FACTS", "title": "Why send Webb 1.5 million kilometres beyond Earth?", "intro": "Start with the reason, see the relationship, then change one condition. These bespoke explanations use public NASA sources.", "textTab": "01 Writing", "diagramTab": "02 Diagram", "interactiveTab": "03 Interaction", "videoTab": "04 Storyboard", "textHeading": "Explain the reason in three sentences", "plain": "Webb observes infrared light. To detect very faint signals, its mirrors and detectors need to stay very cold. Its location near L2 lets the sunshield stay between the telescope and the Sun, Earth and Moon, protecting the cold side.", "textTakeaway": "Writing answers: why does this arrangement matter?", "precision": "Webb orbits the Sun and follows an orbit around L2. It does not sit still at the point or rely on hiding in Earth’s shadow.", "diagramHeading": "Give the sentence a visible relationship", "diagramTakeaway": "A diagram answers: what sits between what?", "interactiveHeading": "Predict first: can distance replace the shield?", "interactiveTakeaway": "Interaction asks: how does a relationship change when a condition changes?", "sunControl": "Show the Sun’s schematic line", "earthControl": "Show Earth’s schematic line", "moonControl": "Show the Moon’s schematic line", "shieldControl": "Show the sunshield", "shieldOn": "The schematic lines stop at the shield.", "shieldOff": "With the shield hidden, the schematic lines reach the telescope. Distance does not replace shielding.", "none": "All schematic lines are hidden. This changes the drawing; the celestial bodies have not disappeared.", "lineCount": "Schematic lines shown: ", "interactionNote": "The switches change this drawing. They do not change celestial bodies or calculate temperature or heat.", "videoHeading": "Give attention a route through the reason", "videoTakeaway": "A video asks: what should we notice first, then understand next?", "storyLabel": "Animated web storyboard · No narrated film yet", "next": "Next step", "play": "Play storyboard", "pause": "Pause", "reset": "Start again", "sourcesHeading": "Where the facts come from", "sourcesNote": "A real NASA mission; the four explanations and interaction are ours. We do not claim NASA used an agent or that these formats improve learning by a measured amount.", "back": "Back to the article", "taskHeading": "Give the agent this assignment", "task": "Use only the NASA sources below to explain why Webb goes near L2. Write three plain sentences, draw the spatial relationship, build a page with a sunshield toggle, and propose an explainer storyboard. Keep facts consistent across all four forms; link the sources and label each simplification.", "diagramTitle": "Keep heat sources on one side of the shield", "coldSide": "Cold side", "sun": "Sun", "earth": "Earth", "moon": "Moon", "sourceLabel": "Light and heat sources", "shieldLabel": "Sunshield", "scopeLabel": "Telescope", "location": "Webb orbits the Sun, around L2, about 1.5 million km from Earth.", "limit": "Schematic · Size, distance and heat not to scale · No temperature simulation", "steps": [["01 / Why stay cold?", "Start with the need: faint infrared signals require very cold mirrors and detectors."], ["02 / Where does heat come from?", "Introduce the Sun, Earth and Moon one by one, keeping the three sources on the same side."], ["03 / What does the shield do?", "Add the shield. Sources, shielding and the telescope now make a visible causal relationship."], ["04 / Why does location help?", "Its location near L2 helps maintain this arrangement. This diagram only shows shielding; Webb actually follows an orbit around L2. Invite a prediction next: what if there were no shield?"]]}}, diagram="<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1200 675\" role=\"img\" aria-labelledby=\"diagram-title diagram-desc\">\n<title id=\"diagram-title\">韦伯：把热源留在遮阳板的同一侧</title><desc id=\"diagram-desc\">太阳、地球和月亮位于图左侧，遮阳板在中间，望远镜在右侧。箭头是位置与遮挡示意，尺寸、距离和热量不按比例。</desc>\n<defs><linearGradient id=\"paper\"><stop stop-color=\"#f8f4eb\"/><stop offset=\"1\" stop-color=\"#eaece3\"/></linearGradient><linearGradient id=\"metal\"><stop stop-color=\"#d8cbb8\"/><stop offset=\".5\" stop-color=\"#faf4e8\"/><stop offset=\"1\" stop-color=\"#a9b6ad\"/></linearGradient><marker id=\"arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 1L9 5L0 9\" fill=\"none\" stroke=\"#ba684e\" stroke-width=\"1.5\"/></marker></defs>\n<rect width=\"1200\" height=\"675\" rx=\"24\" fill=\"url(#paper)\"/>\n<g font-family=\"system-ui, sans-serif\" fill=\"#24433e\"><text x=\"60\" y=\"66\" font-size=\"16\" letter-spacing=\"3\" fill=\"#68776d\">ONE QUESTION · FOUR OUTPUTS</text><text data-key=\"diagramTitle\" x=\"60\" y=\"116\" font-size=\"32\" font-weight=\"650\">把热源留在遮阳板的同一侧</text>\n<path d=\"M735 172L735 470\" stroke=\"#bcc8ba\" stroke-dasharray=\"4 8\"/><text data-key=\"coldSide\" x=\"865\" y=\"184\" font-size=\"18\" text-anchor=\"middle\" fill=\"#526e65\">冷的一侧</text>\n<g id=\"sources\"><g id=\"sun\"><circle cx=\"170\" cy=\"235\" r=\"32\" fill=\"#d79a4c\"/><circle cx=\"170\" cy=\"235\" r=\"42\" fill=\"none\" stroke=\"#d79a4c\" stroke-opacity=\".3\"/><text data-key=\"sun\" x=\"105\" y=\"242\" text-anchor=\"end\" font-size=\"20\">太阳</text></g><g id=\"earth\"><circle cx=\"170\" cy=\"345\" r=\"22\" fill=\"#648a86\"/><path d=\"M158 326L166 339L159 352L178 361\" fill=\"none\" stroke=\"#afbd94\" stroke-width=\"8\"/><text data-key=\"earth\" x=\"105\" y=\"352\" text-anchor=\"end\" font-size=\"20\">地球</text></g><g id=\"moon\"><circle cx=\"170\" cy=\"440\" r=\"15\" fill=\"#acb2a8\"/><text data-key=\"moon\" x=\"105\" y=\"447\" text-anchor=\"end\" font-size=\"20\">月亮</text></g></g>\n<g fill=\"none\" stroke=\"#ba684e\" stroke-width=\"3\" marker-end=\"url(#arrow)\"><path id=\"ray-sun\" d=\"M220 235L574 294\"/><path id=\"ray-earth\" d=\"M210 345L574 345\"/><path id=\"ray-moon\" d=\"M202 440L574 390\"/></g>\n<g id=\"shield\"><path d=\"M589 202L575 441L604 451L618 212Z\" fill=\"#b3baae\" stroke=\"#82988b\"/><path d=\"M606 203L592 442L621 452L635 213Z\" fill=\"url(#metal)\" stroke=\"#a4ae9f\"/><path d=\"M623 204L609 443L638 453L652 214Z\" fill=\"url(#metal)\" stroke=\"#a4ae9f\"/><path d=\"M640 205L626 444L655 454L669 215Z\" fill=\"url(#metal)\" stroke=\"#a4ae9f\"/><path d=\"M657 206L643 445L672 455L686 216Z\" fill=\"url(#metal)\" stroke=\"#82988b\"/></g>\n<g id=\"telescope\"><path d=\"M891 253L958 292L958 369L891 408L824 369L824 292Z\" fill=\"#d9b571\" stroke=\"#9b7b4b\" stroke-width=\"2\"/><path d=\"M891 265V395M835 299L946 362M835 362L946 299\" stroke=\"#af904f\" stroke-width=\"2\"/><circle cx=\"891\" cy=\"331\" r=\"12\" fill=\"#435d55\"/><path d=\"M891 331L977 401\" stroke=\"#526e65\" stroke-width=\"6\"/><circle cx=\"977\" cy=\"401\" r=\"7\" fill=\"#526e65\"/></g>\n<text data-key=\"sourceLabel\" x=\"170\" y=\"508\" font-size=\"17\" text-anchor=\"middle\" fill=\"#69776c\">光与热的来源</text><text data-key=\"shieldLabel\" x=\"634\" y=\"508\" font-size=\"20\" text-anchor=\"middle\">遮阳板</text><text data-key=\"scopeLabel\" x=\"897\" y=\"508\" font-size=\"20\" text-anchor=\"middle\">望远镜</text>\n<path d=\"M60 552H1140\" stroke=\"#c7cfc0\"/><text data-key=\"location\" x=\"60\" y=\"592\" font-size=\"20\">韦伯绕太阳运行，在距地球约 150 万公里的 L2 附近绕行。</text><text data-key=\"limit\" x=\"60\" y=\"628\" font-size=\"15\" fill=\"#69776c\">位置与遮挡示意 · 尺寸、距离、热量不按比例 · 并非温度模拟</text></g></svg>";
let language=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh', step=0, timer=null;
for(const prefix of ['diagram','interactive','video']){const host=document.getElementById(prefix+'-viz');host.innerHTML=diagram.replace(/id="([^"]+)"/g,(_,id)=>'id="'+prefix+'-'+id+'"').replace(/url\(#([^)]+)\)/g,(_,id)=>'url(#'+prefix+'-'+id+')').replace('aria-labelledby="diagram-title diagram-desc"','aria-labelledby="'+prefix+'-diagram-title '+prefix+'-diagram-desc"');host.querySelector('svg').classList.add('viz')}
function translate(){const m=messages[language];document.documentElement.lang=language;document.querySelectorAll('[data-key]').forEach(el=>el.textContent=m[el.dataset.key]);document.getElementById('lang').textContent=language==='zh'?'English':'中文';document.querySelector('header a').href='review.html?lang='+language;document.querySelectorAll('svg title').forEach(el=>el.textContent=m.diagramTitle);document.querySelectorAll('svg desc').forEach(el=>el.textContent=m.limit);updateInteractive();drawStep();document.getElementById('play').textContent=m[timer?'pause':'play']}
function updateInteractive(){const shield=document.getElementById('show-shield').checked;document.getElementById('interactive-shield').style.opacity=shield?'1':'0';let count=0;for(const [source,y,start,end] of [['sun',235,220,294],['earth',345,210,345],['moon',440,202,390]]){const on=document.getElementById('show-'+source).checked;const path=document.getElementById('interactive-ray-'+source);path.style.opacity=on?'1':'0';path.setAttribute('d',shield?'M'+start+' '+y+'L574 '+end:'M'+start+' '+y+'L824 331');if(on)count++}const m=messages[language];document.getElementById('status').textContent=count?m.lineCount+count+' · '+m[shield?'shieldOn':'shieldOff']:m.none}
function stop(){if(timer)clearInterval(timer);timer=null;document.getElementById('play').textContent=messages[language].play}
function drawStep(){const m=messages[language];document.getElementById('step-title').textContent=m.steps[step][0];document.getElementById('step-copy').textContent=m.steps[step][1];document.getElementById('video-sources').style.opacity=step>=1?'1':'.08';document.getElementById('video-shield').style.opacity=step>=2?'1':'0';for(const [s,y,start,end] of [['sun',235,220,294],['earth',345,210,345],['moon',440,202,390]]){const ray=document.getElementById('video-ray-'+s);ray.style.opacity=step>=1?'1':'0';ray.setAttribute('d',step>=2?'M'+start+' '+y+'L574 '+end:'M'+start+' '+y+'L824 331')}document.querySelectorAll('.step-progress i').forEach((el,i)=>el.classList.toggle('active',i<=step));document.getElementById('next').disabled=step===3}
function selectTab(tab){stop();document.querySelectorAll('[data-tab]').forEach(el=>el.setAttribute('aria-selected',String(el.dataset.tab===tab)));for(const key of ['text','diagram','interactive','video'])document.getElementById('panel-'+key).hidden=key!==tab}
document.querySelectorAll('[data-tab]').forEach(el=>{el.onclick=()=>selectTab(el.dataset.tab);el.onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-tab]')];let i=tabs.indexOf(el);if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();i=(i+(e.key==='ArrowRight'?1:3))%4;tabs[i].focus();selectTab(tabs[i].dataset.tab)}}});
document.querySelectorAll('.controls input').forEach(el=>el.onchange=updateInteractive);document.getElementById('lang').onclick=()=>{language=language==='zh'?'en':'zh';translate()};document.getElementById('next').onclick=()=>{stop();step=Math.min(3,step+1);drawStep()};document.getElementById('reset').onclick=()=>{stop();step=0;drawStep()};document.getElementById('play').onclick=()=>{if(timer){stop();return}if(step===3)step=0;drawStep();document.getElementById('play').textContent=messages[language].pause;timer=setInterval(()=>{step=Math.min(3,step+1);drawStep();if(step===3)stop()},6500)};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});translate();
