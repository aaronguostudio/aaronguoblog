name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      static_export:
        description: Also verify the standalone static export
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: blog-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deployment-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/test-deployment-policy.mjs
  build:
    if: github.event_name == 'workflow_dispatch'
    needs: deployment-policy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 11.2.2
          run_install: false

      - name: Install dependencies
        run: CI=true pnpm install --frozen-lockfile

      - name: Same local acceptance command
        run: pnpm run verify:local

      - name: Static generation check
        if: inputs.static_export
        run: pnpm run generate
